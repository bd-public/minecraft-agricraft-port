license="MIT"
issueTrackerURL="https://github.com/AgriCraft/AgriCraft/issues"

[[mods]]
modId="agricraft"
version="${version}"
displayName="AgriCraft"
displayURL="https://www.curseforge.com/minecraft/mc-mods/agricraft"
updateJSONURL = "https://raw.githubusercontent.com/AgriCraft/AgriCraft/master/version.json"
logoFile="logo.png"
authors="InfinityRaider, Ketheroth"
description='''
Agricultural farming extended
'''

[[mixins]]
config="agricraft.mixins.json"

[[dependencies.agricraft]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.agricraft]]
modId = "minecraft"
type="required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.agricraft]]
modId = "mysticalagriculture"
type = "optional"
versionRange = "[9.0.11,)"
ordering = "AFTER"
side = "BOTH"
